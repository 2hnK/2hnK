name: Check GitHub Readme Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  STATS_BASE_URL: https://github-readme-stats-mu-three-1ietx0yab2.vercel.app
  USERNAME: 2hnK

jobs:
  check-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check stats and top languages cards
        shell: bash
        run: |
          set -euo pipefail

          check_card() {
            local name="$1"
            local url="$2"
            local response
            response="$(mktemp)"

            curl --fail --location --silent --show-error --retry 3 --retry-delay 5 "$url" --output "$response"

            if ! grep -q "<svg" "$response"; then
              echo "::error::$name did not return an SVG"
              cat "$response"
              exit 1
            fi

            if grep -qiE "something went wrong|error|rate limit" "$response"; then
              echo "::error::$name returned an error card"
              cat "$response"
              exit 1
            fi

            rm -f "$response"
          }

          check_card \
            "GitHub Stats" \
            "${STATS_BASE_URL}/api?username=${USERNAME}&show_icons=true&theme=radical&hide_border=true&count_private=true"

          check_card \
            "Top Languages" \
            "${STATS_BASE_URL}/api/top-langs/?username=${USERNAME}&layout=compact&theme=radical&hide_border=true&langs_count=8"
